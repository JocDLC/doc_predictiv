name: Harness CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          npm install -g @fission-ai/openspec@1.6.0
          pip install pipx
          pipx install graphifyy==0.9.105
          pipx install uv==0.11.25

      - name: Verify harness
        run: |
          export PATH=$HOME/.local/bin:$PATH
          echo 'PATH=$HOME/.local/bin:$PATH' >> $GITHUB_ENV
          scripts/verify-setup.sh

      - name: Update graph
        run: |
          export PATH=$HOME/.local/bin:$PATH
          graphify update .

  automation-salesforce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation_salesforce
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify automation formatting
        run: python harness.py format-check

      - name: Lint automation code
        run: python harness.py lint

      - name: Compile automation code
        run: python harness.py compile

      - name: Test automation code
        run: python harness.py test

      - name: Verify business contract graph
        run: python harness.py business-contracts
